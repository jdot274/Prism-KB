name: Site bug
description: Report a broken link, render glitch, or build failure
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Affected page URL or path
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
